<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>구해줘 독도! — 준비 중</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">
  <style>
    @font-face { font-family: "DoHyeonSub"; src: url("TemplateData/dohyeon-sub.woff") format("woff"); font-display: swap; }
    html, body { margin: 0; height: 100%; background: #1b2b36; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font-family: "DoHyeonSub", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #fff; text-align: center;
      background: linear-gradient(rgba(27,43,54,.2), rgba(27,43,54,.8)), url("TemplateData/bg.png") center / cover no-repeat;
      image-rendering: pixelated;
    }
    .logo { width: 120px; height: 120px; background: url("TemplateData/icon-sheet.png") 0 0 / 200% 100%; image-rendering: pixelated; }
    h1 { margin: 0; font-size: clamp(36px, 8vw, 72px); text-shadow: 4px 4px 0 #20262b; }
    p { margin: 0; font-size: clamp(16px, 3vw, 24px); color: #f4e3c3; text-shadow: 2px 2px 0 #20262b; }
  </style>
</head>
<body>
  <div class="logo" aria-hidden="true"></div>
  <h1>구해줘 독도!</h1>
  <p>웹 버전을 준비하고 있어요. 곧 여기에서 플레이할 수 있어요.</p>
</body>
</html>
