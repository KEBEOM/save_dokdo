<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b2b36">
  <meta name="description" content="정령과 독도 친구들을 구하며 독도의 역사와 자연을 배우는 4, 5학년 독도 교육 게임">
  <meta property="og:title" content="구해줘 독도!">
  <meta property="og:description" content="정령과 독도 친구들을 구하며 독도의 역사와 자연을 배우는 게임">
  <meta property="og:image" content="assets/img/bg1.png">
  <title>구해줘 독도!</title>
  <link rel="icon" type="image/png" href="assets/img/AppIcon.png">
  <style>
    @font-face { font-family: "DoHyeon"; src: url("assets/dohyeon.woff") format("woff"); font-display: swap; }
    html, body { margin: 0; height: 100%; background: #1b2b36; overflow: hidden; }
    /* 폰에서 화면을 꾹 눌러도 글자 선택·복사·이미지 저장 메뉴가 뜨지 않게 */
    html, body, canvas, div { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; align-items: center; justify-content: center; font-family: "DoHyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    canvas { display: block; touch-action: none; image-rendering: pixelated; box-shadow: 0 0 0 4px #20262b, 0 12px 40px rgba(0,0,0,.5); background: #000; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      color: #fff; background: linear-gradient(rgba(27,43,54,.25), rgba(27,43,54,.85)), url("assets/img/bg1.png") center / cover; image-rendering: pixelated; z-index: 5; }
    #loading h1 { margin: 0; font-size: clamp(40px, 8vw, 80px); font-weight: normal; text-shadow: 4px 4px 0 #20262b; }
    #load-bar { width: min(60vw, 480px); height: 22px; border: 4px solid #20262b; background: #f4e3c3; }
    #load-fill { height: 100%; width: 5%; background: #6aa84f; transition: width .2s; }
    #load-text { font-size: 20px; color: #f4e3c3; text-shadow: 2px 2px 0 #20262b; }
    #rotate { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #1b2b36; color: #fff; font-size: 22px; text-align: center; padding: 24px; }
    #rotate .phone { width: 46px; height: 78px; border: 5px solid #f4e3c3; border-radius: 8px; animation: turn 1.8s ease-in-out infinite; }
    @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    noscript { color: #fff; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="구해줘 독도 게임 화면"></canvas>
  <div id="loading">
    <h1>구해줘 독도!</h1>
    <div id="load-bar"><div id="load-fill"></div></div>
    <div id="load-text">불러오는 중…</div>
  </div>
  <div id="rotate"><div class="phone"></div><div>휴대폰을 가로로 돌려 주세요</div></div>
  <noscript>이 게임은 JavaScript가 켜져 있어야 실행돼요.</noscript>
  <script type="module" src="game/main.js"></script>
</body>
</html>
